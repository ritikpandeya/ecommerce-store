<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleStore - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="/index.html" class="logo">SimpleStore</a>

        <div class="nav-links">
            <a href="/index.html">Shop</a>
            <a href="/cart.html">Cart (<span id="nav-cart-count">0</span>)</a>
            <a href="/login.html" id="nav-login">Login</a>
            <a href="/register.html" id="nav-register">Register</a>
            <a href="#" id="nav-logout" style="display: none;">Logout</a>
        </div>
    </nav>
</header>

<div class="container">

    <div class="form-container">

        <h2>User Login</h2>

        <div id="error-msg" class="error-msg"></div>

        <form id="login-form">

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <p style="text-align: center; margin-top: 1rem;">
            Don't have an account?
            <a href="/register.html">Register here</a>
        </p>

    </div>

</div>

<script src="/js/api.js"></script>
<script src="/js/login.js"></script>

</body>
</html>
