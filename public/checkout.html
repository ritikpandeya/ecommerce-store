<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleStore - Checkout</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="/index.html" class="logo">SimpleStore</a>

        <div class="nav-links">
            <a href="/index.html">Shop</a>

            <a href="/cart.html">
                Cart (<span id="nav-cart-count">0</span>)
            </a>

            <a href="/login.html" id="nav-login">Login</a>

            <a href="/register.html" id="nav-register">Register</a>

            <a href="#" id="nav-logout" style="display: none;">
                Logout
            </a>
        </div>
    </nav>
</header>

<div class="container">

    <div class="form-container">

        <h2>Checkout Details</h2>

        <div id="error-msg" class="error-msg"></div>

        <form id="checkout-form">

            <div class="form-group">
                <label>Shipping Name</label>

                <input
                    type="text"
                    id="shipping_name"
                    placeholder="Enter recipient name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Shipping Address</label>

                <textarea
                    id="shipping_address"
                    rows="4"
                    placeholder="Enter complete shipping address"
                    required
                ></textarea>
            </div>

            <button
                type="submit"
                class="btn"
                id="place-order-btn">
                Place Order
            </button>

        </form>

    </div>

</div>

<script src="/js/api.js"></script>
<script src="/js/checkout.js"></script>

</body>
</html>
